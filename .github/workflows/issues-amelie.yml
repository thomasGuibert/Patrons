# Écouteur des issues d'Amélie (login GitHub Lilie145075) : Claude prend en charge
# chaque issue qu'elle ouvre, et répond quand elle écrit « @claude » dans un commentaire.
# Secret nécessaire : CLAUDE_CODE_OAUTH_TOKEN (obtenu avec `claude setup-token` sur le PC).
name: Issues d'Amélie

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: "Numéro de l'issue à (re)traiter"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.user.login == 'Lilie145075') ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'Lilie145075' &&
       !github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Seamly2D Linux (même version que le PC) pour exporter les pièces et refaire les PDF
      # sans passer par le PC de Thomas (mêmes étapes que sur-mesure.yml).
      - name: Bibliothèques pour Seamly sans écran
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libopengl0 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libglib2.0-0t64 libxcb-cursor0 libxkbcommon-x11-0 xvfb \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          sudo locale-gen fr_FR.UTF-8
          pip install -q reportlab pypdf pillow

      - uses: actions/cache@v4
        id: seamly
        with:
          path: ${{ runner.temp }}/seamly
          key: seamly-v2026.7.13.214-temp

      - name: Télécharger Seamly2D pour Linux
        if: steps.seamly.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSL -o seamly.AppImage https://github.com/FashionFreedom/Seamly2D/releases/download/v2026.7.13.214/Seamly2D-x86_64.AppImage
          chmod +x seamly.AppImage
          ./seamly.AppImage --appimage-extract > /dev/null
          mv squashfs-root seamly

      - name: Labels utilisés par Claude
        run: |
          gh label create amelie-prise-en-charge --color C2410C --description "Issue d'Amélie prise en charge par Claude" || true
          gh label create needs-info --color FBCA04 --description "Information manquante" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Amélie n'est pas collaboratrice du dépôt : l'autoriser explicitement.
          # L'app Claude refuse son jeton à qui n'a pas les droits d'écriture (« User does
          # not have write access »), d'où le jeton du workflow. Pour que `gh pr create`
          # marche avec lui : Settings > Actions > General > « Allow GitHub Actions to
          # create and approve pull requests ».
          allowed_non_write_users: Lilie145075
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"
          prompt: |
            Dépôt : ${{ github.repository }}. Issue n° ${{ github.event.issue.number || inputs.issue }},
            ouverte par Amélie (Lilie145075), co-fondatrice d'Atelier AT. Écris en français.

            1. Lis l'issue en entier avec `gh issue view <n> --comments`, y compris les images
               jointes (télécharge-les avec curl et regarde-les). Si l'issue a déjà été traitée,
               réponds seulement au dernier commentaire d'Amélie.
            2. Poste d'abord un court commentaire « Bien reçu, je m'en occupe. » et ajoute le label
               `amelie-prise-en-charge`.
            3. Lis CLAUDE.md, GLOSSARY.md et docs/ pour respecter les conventions du dépôt. En
               particulier : ne jamais utiliser une base de maille pour un vêtement en chaîne et
               trame (ni l'inverse) ; étiquettes et droit-fil entiers dans la pièce ; coutures à
               l'extérieur du contour ; ne jamais déplacer des points existants d'un tracé.
            Seamly2D est installé : lance-le toujours sous `xvfb-run -a`, le chemin est dans
            la variable SEAMLY2D (déjà réglée, avec LANG=fr_FR.UTF-8). Tu peux donc exporter les
            pièces et refaire les PDF toi-même, sans attendre le PC, par exemple
            `xvfb-run -a python3 .claude/skills/exporter-pdf/toutes_tailles.py <patron>` ou
            `mesures_vers_pdf.py` (voir .claude/skills/exporter-pdf/SKILL.md), puis regarder
            les PDF obtenus et lancer le skill verifier-patron. Ne réponds jamais que Seamly
            manque : s'il échoue, cite le message d'erreur exact.

            4. Traite la demande autant que possible : choisir la base adaptée, écrire le tracé
               .sm2d et sa documentation, etc. Travaille sur une branche
               `claude/issue-<n>-<court-nom>`, historique linéaire (rebase, jamais de merge),
               pousse-la et ouvre une PR avec `gh pr create` qui référence l'issue
               (« Closes #<n> » seulement si la demande est entièrement traitée), assignée à
               thomasGuibert. Relis ensuite ta PR de façon critique et attends la fin des
               vérifications (`gh pr checks <pr> --watch`). S'il n'y a aucun problème (vérifications
               vertes, pas de conflit, rien de douteux dans le tracé), fusionne-la toi-même avec
               `gh pr merge <pr> --rebase` (jamais de commit de merge). Sinon ne la fusionne pas,
               demande la relecture de thomasGuibert et explique le problème dans la PR.
            5. S'il manque une information indispensable (mesure, matière, taille…), ne devine
               pas : pose la question à Amélie dans l'issue et ajoute le label `needs-info`.
            6. Termine par un commentaire sur l'issue qui résume, en mots simples pour une
               couturière (pas de jargon informatique), ce qui a été fait, le lien de la PR et ce
               qu'il reste à vérifier sur le PC avec Seamly2D.

            Tout commentaire GitHub finit par :

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
        env:
          GH_TOKEN: ${{ github.token }}
          SEAMLY2D: ${{ runner.temp }}/seamly/AppRun
          LANG: fr_FR.UTF-8
          LC_ALL: fr_FR.UTF-8
