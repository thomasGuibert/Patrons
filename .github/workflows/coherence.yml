# Contrôles de cohérence des tracés (outils/coherence) : courbes sans angle, points immobiles,
# longueurs des coutures, crans, sur toutes les tailles et des jeux sur mesure. Le rapport est
# dans le résumé du run ; le run échoue si un contrôle échoue.
name: Cohérence des tracés

on:
  pull_request:
    paths:
      - 'patrons/**'
      - 'mesures/**'
      - 'outils/coherence/**'
      - '.claude/skills/tracer-sm2d/evaluer_hors_seamly.py'
      - '.github/workflows/coherence.yml'
  push:
    branches: [main]
    paths:
      - 'patrons/**'
      - 'mesures/**'
      - 'outils/coherence/**'
      - '.claude/skills/tracer-sm2d/evaluer_hors_seamly.py'
      - '.github/workflows/coherence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controles:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques pour Qt sans écran
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libopengl0 libfontconfig1 \
            libxkbcommon0 libdbus-1-3 libglib2.0-0t64 libxcb-cursor0 libxkbcommon-x11-0 xvfb \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          pip install -q reportlab

      - uses: actions/cache@v4
        id: seamly
        with:
          path: squashfs-root
          key: seamly-v2026.7.13.214

      - name: Télécharger Seamly2D pour Linux
        if: steps.seamly.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o seamly.AppImage https://github.com/FashionFreedom/Seamly2D/releases/download/v2026.7.13.214/Seamly2D-x86_64.AppImage
          chmod +x seamly.AppImage
          ./seamly.AppImage --appimage-extract > /dev/null

      - name: Contrôler les patrons
        env:
          SEAMLY2D: ${{ github.workspace }}/squashfs-root/AppRun
        run: |
          set -o pipefail
          xvfb-run -a python3 outils/coherence/coherence.py --seamly | tee -a "$GITHUB_STEP_SUMMARY"
