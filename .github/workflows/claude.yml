# Écouteur général : Claude répond quand quelqu'un qui a les droits d'écriture sur le dépôt
# (Thomas) écrit « @claude » dans une issue, un commentaire d'issue ou de PR, ou une relecture.
# Les issues d'Amélie (pas collaboratrice) passent par issues-amelie.yml.
# Nécessite : l'app GitHub Claude installée sur le dépôt et le secret CLAUDE_CODE_OAUTH_TOKEN
# (obtenu avec `claude setup-token` sur le PC).
name: Claude (@claude)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
       contains(github.event.review.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"
            --append-system-prompt "Écris en français. Respecte CLAUDE.md (historique linéaire : rebase, jamais de merge). Tout commentaire GitHub finit par la ligne _Generated by [Claude Code](https://claude.ai/code)_."
        env:
          GH_TOKEN: ${{ github.token }}
