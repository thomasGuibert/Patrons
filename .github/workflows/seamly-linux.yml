# Essai : Seamly2D Linux sans écran trace-t-il comme le Seamly Windows ? (issue #34)
name: Essai Seamly Linux

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/seamly-linux.yml'
      - 'outils/seamly_linux/**'

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques pour Qt sans écran
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libfontconfig1 libxkbcommon0 \
            libdbus-1-3 libglib2.0-0t64 libxcb-cursor0 libxkbcommon-x11-0 xvfb
          pip install -q reportlab

      - name: Télécharger Seamly2D pour Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/FashionFreedom/Seamly2D/releases?per_page=15' \
            --jq '.[] | .tag_name + " : " + (.assets | map(.name) | join(", "))'
          url=$(gh api 'repos/FashionFreedom/Seamly2D/releases?per_page=30' \
            --jq '[.[] | .assets[] | select(.name | test("(?i)appimage$"))][0].browser_download_url')
          echo "AppImage : $url"
          test -n "$url"
          curl -sSL -o seamly.AppImage "$url"
          chmod +x seamly.AppImage
          ./seamly.AppImage --appimage-extract > /dev/null
          ls squashfs-root squashfs-root/usr/bin

      - name: Exporter, comparer, faire les PDF
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 outils/seamly_linux/essai.py "$PWD/squashfs-root/AppRun" essai | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-seamly-linux
          path: essai/
