# Essai : Seamly2D Linux sans écran trace-t-il comme le Seamly Windows ? (issue #34)
name: Essai Seamly Linux

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/seamly-linux.yml'
      - 'outils/seamly_linux/**'

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques pour Qt sans écran
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libfontconfig1 libxkbcommon0 \
            libdbus-1-3 libglib2.0-0t64 libxcb-cursor0 libxkbcommon-x11-0 xvfb \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          sudo locale-gen fr_FR.UTF-8
          pip install -q reportlab

      - name: Télécharger Seamly2D pour Linux
        run: |
          # même version que le Seamly Windows du PC
          url=https://github.com/FashionFreedom/Seamly2D/releases/download/v2026.7.13.214/Seamly2D-x86_64.AppImage
          curl -sSL -o seamly.AppImage "$url"
          chmod +x seamly.AppImage
          ./seamly.AppImage --appimage-extract > /dev/null
          ls squashfs-root squashfs-root/usr/bin

      - name: Exporter, comparer, faire les PDF
        env:
          # étiquettes en français, comme sur le PC
          LANG: fr_FR.UTF-8
          LC_ALL: fr_FR.UTF-8
        run: |
          # l'AppImage n'embarque que le greffon Qt xcb : écran virtuel
          set -o pipefail
          xvfb-run -a python3 outils/seamly_linux/essai.py "$PWD/squashfs-root/AppRun" essai | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: essai-seamly-linux
          path: essai/
