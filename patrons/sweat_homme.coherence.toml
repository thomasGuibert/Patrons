# Contrôles de cohérence du sweat homme : python3 outils/coherence/coherence.py sweat_homme
# Un tronçon = [pièce, point de départ, point d'arrivée], le long de la ligne de couture, par le
# plus court des deux chemins. Points de chaque pièce : python3 outils/coherence/pieces.py patrons/sweat_homme.sm2d

gammes = ["homme"]
profils = false     # pas encore de sur-mesure sur le site

# --- 1. Courbes sans angle (raccords entre tronçons : une fois cousus)

[[courbe]]
nom = "Emmanchure"
troncons = [["Devant", "vC2", "vKp"], ["Dos", "vKpp", "vC2"]]
fermee = true       # se referme à la couture de côté

[[courbe]]
nom = "Tête de manche"
troncons = [["Manche", "mI", "mIp"]]
fermee = true       # se referme à la couture de dessous de bras

[[courbe]]
nom = "Encolure"
troncons = [["Dos", "vF", "vHpp"], ["Devant", "vHp", "vE"]]
pli_debut = true    # milieux dos et devant au pli
pli_fin = true

[[courbe]]
nom = "Côté"
troncons = [["Devant", "vFd", "vC2"]]

# --- 3 et 4. Coutures (a et b se cousent ensemble, du premier point au dernier)

[[couture]]
nom = "Emmanchure et tête de manche"
a = [["Devant", "vC2", "vKp"], ["Dos", "vKpp", "vC2"]]
b = [["Manche", "mIp", "mI"]]
ecart = [0.5, 1.0]  # embu

[[couture]]
nom = "Épaule"
a = [["Devant", "vHp", "vKp"]]
b = [["Dos", "vHpp", "vKpp"]]

[[couture]]
nom = "Côté (au-dessus des fentes)"
a = [["Devant", "vFd", "vC2"]]
b = [["Dos", "vFb", "vC2"]]

[[couture]]
nom = "Dessous de bras"
a = [["Manche", "mI", "mF1"]]
b = [["Manche", "mIp", "mF2"]]

# bords-côtes : réduits de #red_bc
[[couture]]
nom = "Bord-côte d'encolure"
a = [["Dos", "vF", "vHpp"], ["Devant", "vHp", "vE"], ["Devant", "vE", "vHp"], ["Dos", "vHpp", "vF"]]
b = [["Bord-côte d'encolure", "beA", "beB"]]
rapport = "#red_bc"
crans_aux_raccords = false

[[couture]]
nom = "Poignet"
a = [["Manche", "mF2", "mF1"]]
b = [["Poignet", "bpA", "bpB"]]
rapport = "#red_bc"

[[couture]]
nom = "Bord-côte de bas devant"
a = [["Devant", "vA1d", "A"], ["Devant", "A", "vA1d"]]
b = [["Bord-côte de bas devant", "bdA", "bdB"]]
rapport = "#red_bc"
crans_aux_raccords = false

[[couture]]
nom = "Bord-côte de bas dos"
a = [["Dos", "vA1b", "A"], ["Dos", "A", "vA1b"]]
b = [["Bord-côte de bas dos", "bbA", "bbB"]]
rapport = "#red_bc"
crans_aux_raccords = false
